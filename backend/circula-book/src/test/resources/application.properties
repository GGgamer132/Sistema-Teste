# Configuração dos testes automatizados: H2 em memória (modo PostgreSQL),
# schema criado pelo Hibernate e SEM o data.sql (cada teste monta seus dados).
spring.datasource.url=jdbc:h2:mem:circulabook;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jackson.serialization.fail-on-empty-beans=false
circulabook.jwt.secret=segredo-apenas-para-testes-automatizados-0123456789
circulabook.jwt.expiracao-horas=8
logging.level.root=WARN
