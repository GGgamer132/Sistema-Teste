spring.application.name=circula-book

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/circula_book_db
spring.datasource.username=circula_user
spring.datasource.password=circula_senha_123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# "create" recria o schema a cada start (bom para desenvolvimento).
# Troque para "update" quando quiser preservar os dados entre execucoes.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Evita o erro de serializacao JSON em relacionamentos LAZY do Hibernate
spring.jackson.serialization.fail-on-empty-beans=false

# ===== SQL Init (executa data.sql apos o Hibernate criar as tabelas) =====
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===== Server =====
server.port=8080
server.servlet.context-path=/

# ===== Logging =====
logging.level.root=INFO
logging.level.com.circulabook=DEBUG
